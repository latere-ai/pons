# Every push to main and every pull request runs the gate, the shared
# pipeline of latere-ai/ci.
name: verify

# A push or pull request that changes only specs or markdown starts no run,
# because no build or test reads them. The exceptions are the four specs that
# tests hold to the code: the objects, the API, the identity and authorization
# table, and the distribution variables. `lateregate release` runs the whole
# bar, the spec tree included, before every tag. A tag is never filtered by
# paths.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - "**"
      - "!specs/**"
      - "!**.md"
      - "specs/002-objects.md"
      - "specs/003-api.md"
      - "specs/004-identity-and-authorization.md"
      - "specs/011-distribution.md"
  pull_request:
    paths:
      - "**"
      - "!specs/**"
      - "!**.md"
      - "specs/002-objects.md"
      - "specs/003-api.md"
      - "specs/004-identity-and-authorization.md"
      - "specs/011-distribution.md"
  workflow_dispatch:

# A newer push to the same ref supersedes this run: its commit carries every
# change this one would verify, and the runner is better spent on it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every job runs on a hosted runner. The repository is public, so its
  # pull requests never run on the organization's self-hosted runners.
  gate:
    if: "!startsWith(github.ref, 'refs/tags/')"
    uses: latere-ai/ci/.github/workflows/lateregate.yml@v1
    with:
      runs_on: ubuntu-latest
      test_os: '["ubuntu-latest"]'
