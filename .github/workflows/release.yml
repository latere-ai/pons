# The release pipeline, on a v* tag, through latere-ai/ci's shared image
# release stages. The build stage requires that the tag's commit passed
# verify, checks the tag and its CHANGELOG section, builds ponsd for
# linux/amd64 and linux/arm64, pushes it by digest and under no tag, checks
# the candidate reports the version the tag pins, signs it, and gives it a
# bill of materials and SBOM and provenance attestations. Only then does
# the publish stage tag the digest, sign checksums.txt over the bill of
# materials, and publish the GitHub release with the CHANGELOG section as
# its body. The verify stage then checks the published release the way
# SECURITY.md tells an installer to.
#
# The image namespace is the repository owner's, so a fork's tag publishes
# under the fork's. Each job is granted only what its stage needs.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: latere-ai/ci/.github/workflows/image-build.yml@v1
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    with:
      image_1: '{"name": "ponsd", "version_args": "version", "version_expect": "{name} {tag} ("}'
      runs_on: ubuntu-latest

  publish:
    needs: build
    uses: latere-ai/ci/.github/workflows/image-publish.yml@v1
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      images: ${{ needs.build.outputs.images }}
      runs_on: ubuntu-latest

  verify:
    needs: publish
    uses: latere-ai/ci/.github/workflows/release-verify.yml@v1
    permissions:
      contents: read
      packages: read
      attestations: read
    with:
      images: ponsd
      runs_on: ubuntu-latest
