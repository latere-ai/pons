\* A refresh within Budget seconds, under a lease of Lease seconds, as the Go
\* constants set them: the refresh ends before its lease, so no two replicas
\* ask the token endpoint at once. Two leases fit in Horizon seconds.
CONSTANTS
  Replicas = {r1, r2}
  Horizon = 64
SPECIFICATION Spec
INVARIANT TypeOK
INVARIANT Exclusive
