# The account the core runs as. It holds no token of the cluster's API,
# since ponsd asks the cluster nothing, and pulls the private image with the
# namespace's pull secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ponsd
  labels:
    app.kubernetes.io/name: ponsd
automountServiceAccountToken: false
imagePullSecrets:
  - name: ghcr-secret
