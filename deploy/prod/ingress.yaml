# The core's one rule at the platform origin: /v1/connections on
# api.latere.ai, beside /v1/parsing and the other capabilities, forwarded
# without a rewrite, because the core serves its API under PONS_BASE_PATH.
# There is no tls block and no issuer annotation: the host's certificate is
# the origin's, which arcad's Ingress holds for every rule on api.latere.ai.
#
# A clone or a push through a connection's git address streams through the
# controller: the body limit is above the core's own bound on a forwarded
# body, 2 GiB, which the core holds and answers itself; nothing is spooled
# to the controller's disk; and a pack may take minutes each way.
#
# The console does not come through here: platformd reaches the core in the
# cluster, at the Service, under the same path.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ponsd
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 2049m
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
    - host: api.latere.ai
      http:
        paths:
          - path: /v1/connections
            pathType: Prefix
            backend:
              service:
                name: ponsd
                port:
                  name: public
---
# connect.latere.ai: the host every address the core hands out names
# (PONS_PUBLIC_URL), so a sandbox's token for the connections is scoped to a
# host no other Secret of the sandbox is. Same path, same backend and the
# same streaming as the origin's rule above; this host has a certificate of
# its own.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ponsd-connect
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 2049m
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [connect.latere.ai]
      secretName: ponsd-connect-tls
  rules:
    - host: connect.latere.ai
      http:
        paths:
          - path: /v1/connections
            pathType: Prefix
            backend:
              service:
                name: ponsd
                port:
                  name: public
---
# connect.latere.ai/ itself: a person who opens the host sees where their
# connections are kept, the chat's Connectors settings, rather than the
# controller's empty 404. Only the bare root redirects; every address the
# core hands out is under /v1/connections, on the Ingress above. A
# temporary redirect, so the page it names may change.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ponsd-connect-root
  annotations:
    nginx.ingress.kubernetes.io/temporal-redirect: https://chat.latere.ai/settings/connectors
spec:
  ingressClassName: nginx
  tls:
    - hosts: [connect.latere.ai]
      secretName: ponsd-connect-tls
  rules:
    - host: connect.latere.ai
      http:
        paths:
          - path: /
            pathType: Exact
            backend:
              service:
                name: ponsd
                port:
                  name: public
