# One of the 2 replicas may be evicted at a time, so a node drain leaves the
# other serving.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ponsd
  labels:
    app.kubernetes.io/name: ponsd
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ponsd
