# ponsd serve, 2 replicas. The replicas hold no state of their own: every
# connection, sealed credential, sign-in in progress and call record is a
# row of the database, so they are interchangeable and a rollout replaces
# them one at a time with none missing.
#
# PONS_OIDC_AUDIENCE: `pons` is the core's own audience, which a session's
# token and platformd's service token name; `api.latere.ai` is the platform
# origin's, which the chat's and the console's tokens name.
#
# The database: PONS_DATABASE_URL is the direct endpoint of the database
# pons, which ponsd opens for its migrations at start, under the migrator's
# lock, and closes; the cluster's connection budget holds a reserve for a
# starting Pod's migration. PONS_DATABASE_POOL_URL is its transaction-mode
# pool, whose 2 server connections, one per replica, are the core's line in
# that budget and carry all of its serving. Both are the keys terraform writes into
# pons-db, and the pool is required, because a Pod that served over the
# direct endpoint would take connections the budget does not hold.
#
# PONS_SEALING_KEYS seals every credential the core keeps; GITHUB_APP_
# CLIENT_SECRET is the variable the catalog's GitHub entry names for the
# App's client secret. The authorizer's bearer is a file, the Secret
# ponsd-authorizer mounted read-only.
#
# SSL_CERT_DIR appends platformd's internal CA to the system roots, so the
# decider's certificate verifies; the volume carries ca.crt alone, never the
# CA's key.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ponsd
  labels:
    app.kubernetes.io/name: ponsd
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ponsd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ponsd
    spec:
      serviceAccountName: ponsd
      automountServiceAccountToken: false
      # Above the 25 seconds ponsd gives its open requests after a stop
      # signal, and the preStop sleep before it.
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ponsd
          # The placeholder tag never resolves; the kustomization's images
          # entry names the release this target runs.
          image: ghcr.io/latere-ai/ponsd:unreleased
          args: ["serve"]
          envFrom:
            - configMapRef:
                name: ponsd
          env:
            - name: PONS_ADDR
              value: ":8080"
            - name: PONS_OIDC_AUDIENCE
              value: pons,api.latere.ai
            - name: SSL_CERT_DIR
              value: "/etc/ssl/certs:/var/run/ponsd-trust"
            - name: PONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: pons-db
                  key: DATABASE_URL
            - name: PONS_DATABASE_POOL_URL
              valueFrom:
                secretKeyRef:
                  name: pons-db
                  key: DATABASE_POOL_URL
            - name: PONS_SEALING_KEYS
              valueFrom:
                secretKeyRef:
                  name: ponsd-sealing
                  key: PONS_SEALING_KEYS
            - name: GITHUB_APP_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ponsd-github
                  key: GITHUB_APP_CLIENT_SECRET
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ponsd-google
                  key: GOOGLE_CLIENT_SECRET
          ports:
            - name: public
              containerPort: 8080
          # Separate on purpose: a database or an authorizer that does not
          # answer takes the Pod out of rotation and does not restart it.
          readinessProbe:
            httpGet:
              path: /readyz
              port: public
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: public
            initialDelaySeconds: 10
            periodSeconds: 30
          # A Pod told to stop is still in the Service for the moment its
          # removal takes to reach every proxy; the kubelet's own sleep
          # keeps the listener open through it, since the image has no
          # shell and no sleep.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # The request is what a replica holds at rest, on nodes with
          # little left to request; the limits bound a burst of forwarded
          # requests, whose bodies stream and are not held.
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: catalog
              mountPath: /etc/pons
              readOnly: true
            - name: authorizer
              mountPath: /var/run/ponsd-authorizer
              readOnly: true
            - name: internal-ca
              mountPath: /var/run/ponsd-trust
              readOnly: true
      volumes:
        - name: catalog
          configMap:
            name: ponsd-catalog
        - name: authorizer
          secret:
            secretName: ponsd-authorizer
            items:
              - key: token
                path: token
        - name: internal-ca
          secret:
            secretName: platformd-internal-ca
            items:
              - key: ca.crt
                path: platformd-internal-ca.crt
